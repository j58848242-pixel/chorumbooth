<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHORUM Photobooth - Memori Lo!</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #990d0c;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .viewer-container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 2vh;
        }
        .brand-header img {
            height: 45px;
            margin-bottom: 5px;
        }
        .brand-header h1 {
            font-size: 1.3rem;
            color: var(--accent-color, #ccff00);
            margin: 0;
            letter-spacing: 2px;
            font-weight: 800;
        }
        .photo-frame {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-frame img {
            width: 100%;
            border-radius: 8px;
            display: none; 
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-ig {
            background: var(--accent-color, #ccff00);
            color: #000;
            margin-top: 10px;
        }
        .btn-ig:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-home {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-home:hover {
            background: rgba(255,255,255,0.1);
        }
        .loading-state {
            color: var(--text-secondary, #888);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color, #ccff00);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="viewer-container">
        <div class="brand-header">
            <img src="assets/images/logo-chorum.png" alt="CHORUM Logo" onerror="this.style.display='none'">
        </div>

        <div class="photo-frame" id="photoFrame">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <span>Menarik foto dari memori...</span>
            </div>
            <img id="guestPhoto" src="" alt="Hasil Photobooth CHORUM">
        </div>

        <p style="font-size: 0.85rem; color: #aaa; margin: 0;">
            📸 <b>Tekan dan tahan</b> gambar di atas untuk menyimpan (Save Image) ke HP lu.
        </p>

        <a href="https://www.instagram.com/chorummm?igsi=MTlhZHczcW45N3Q5Yw==" target="_blank" class="btn-action btn-ig">
            Follow & Tag @chorummm 🚀
        </a>
        
        <a href="index.html" class="btn-action btn-home">
            Bikin Punya Lu Sendiri!
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('data'); 
            
            const guestPhoto = document.getElementById('guestPhoto');
            const loadingState = document.getElementById('loadingState');

            if (rawData) {
                try {
                    // PENGAMAN GANDA: Mengembalikan tanda '+' yang sering diubah jadi spasi oleh scanner HP
                    const safeEncodedData = rawData.replace(/ /g, '+');
                    const photoUrl = atob(safeEncodedData);
                    
                    guestPhoto.src = photoUrl;
                    guestPhoto.onload = () => {
                        loadingState.style.display = 'none';
                        guestPhoto.style.display = 'block';
                    };
                    guestPhoto.onerror = () => {
                        loadingState.innerHTML = "❌<br>Duh, gambar gagal dimuat.<br>Mungkin sudah dihapus dari server.";
                    };
                } catch (e) {
                    loadingState.innerHTML = "⚠️<br>Data QR tidak valid atau rusak.";
                }
            } else {
                loadingState.innerHTML = "⚠️<br>URL tidak valid. Foto tidak ditemukan.";
            }
        });
    </script>
</body>
</html>
